<!doctype html>
<html>
<head><meta charset="utf-8"><title>Test Sweepstakes Entry</title></head>
<body>
  <h1>Test Sweepstakes — enter to win</h1>
  <form id="entry"
        onsubmit="event.preventDefault(); document.getElementById('done').textContent='Registration successful! Good luck.';">
    <p><input type="email" name="email" placeholder="Your email address"></p>
    <p><input type="text" name="first_name" placeholder="First name"></p>
    <p><input type="text" name="last_name" placeholder="Last name"></p>
    <p><input type="tel" name="phone" placeholder="Phone number"></p>
    <p><input type="text" name="telegram" placeholder="Telegram username (optional)"></p>
    <!-- decoys: must NEVER be filled -->
    <p><input type="password" name="password" placeholder="Password"></p>
    <p><input type="text" name="card_number" placeholder="Card number"></p>
    <button type="submit">Submit entry</button>
  </form>
  <div id="done"></div>
</body>
</html>
